# HH is collected by the browser companion, not by this plugin: see examples/hh-browser.yml.
job_boards:
  - name: Russian-language job boards
    provider: ru-market
    ru_market:
      source: all
      primary_source_order: [habr-career, geekjob]
      max_pages: 3
      sources:
        habr_career:
          enabled: true
          mode: html
          max_pages: 3
          categories:
            - programmist_python
            - backend_razrabotchik
          remote: true
        geekjob:
          enabled: true
          mode: html
          max_pages: 5
        superjob:
          enabled: false # requires SUPERJOB_API_KEY in career-ops .env
          queries: [Python backend]
        trudvsem:
          enabled: false
          queries: [Python backend]
        getmatch:
          enabled: false # experimental; list only, no server-side text search
          mode: api
          max_pages: 1
          per_page: 20
          # Experimental server-side filters, UNVERIFIED against the live API and off by default (docs/getmatch.md):
          # sa: 300000
          # pa: 7
          # se: [senior]
          # l: [Москва]
        helloworld_rs:
          enabled: false # opt-in Serbian HTML listings; see docs/helloworld.md
          mode: html
          max_pages: 2
          queries: [Python, Data Engineer]
