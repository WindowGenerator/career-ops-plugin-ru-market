name: Live source health
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      # Same upstream repository as test.yml but unpinned: this job tracks upstream HEAD, so it also notices
      # upstream changes to plugins/_engine.mjs buildCtx (Node builtins only) that health depends on.
      - uses: actions/checkout@v4
        with:
          repository: career-ops-hq/career-ops
          path: career-ops
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # buildCtx uses only Node builtins; health needs no core npm install.
      - name: Check one page per source
        working-directory: plugin
        run: node scripts/health.mjs --career-ops ../career-ops > health.json
      - name: Report degradation
        if: failure()
        run: echo '::error::Source health degraded. Inspect the JSON artifact; no vacancy payloads are retained.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-health
          path: plugin/health.json
          retention-days: 14
