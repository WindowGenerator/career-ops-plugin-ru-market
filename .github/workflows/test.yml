name: Offline tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      # Stock upstream core, never patched. Pinned to a commit after upstream PR #4697 (local-parser passes
      # a parser's extra job fields through, merged 2026-10-03); verified to exist and to descend from the
      # merge commit 034ca77 via the GitHub API. health.yml tracks upstream HEAD instead.
      - uses: actions/checkout@v4
        with:
          repository: career-ops-hq/career-ops
          ref: 95709261abfd3679b7cbc91f53f6e486d41cffa7
          path: career-ops
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The pinned core checkout does not track a root package-lock.json (checked at the pinned commit).
      - run: npm install --ignore-scripts --no-package-lock
        working-directory: career-ops
      - run: npm run test:integration
        working-directory: plugin
      - run: npx playwright install --with-deps chromium
        working-directory: career-ops
      - run: npm run test:dom
        working-directory: plugin
