name: Offline tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: career-ops-hq/career-ops
          ref: 8c9aae34244ec2f79d1d21c05a34c5de608e7747
          path: career-ops
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The pinned core checkout does not track a root package-lock.json.
      - run: npm install --ignore-scripts --no-package-lock
        working-directory: career-ops
      - run: npm run test:integration
        working-directory: plugin
      - run: npx playwright install --with-deps chromium
        working-directory: career-ops
      - run: npm run test:dom
        working-directory: plugin
