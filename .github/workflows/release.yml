name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Match tag to manifest version
        run: node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("manifest.json")); if(process.env.GITHUB_REF_NAME !== `v${m.version}`) process.exit(1);'
      - name: Prepare registry entry
        run: node scripts/registry-entry.mjs "$(git rev-parse HEAD)" > ru-market.json
      - name: Prepare install scripts
        run: |
          sha="$(git rev-parse HEAD)"
          for script in install.sh update.sh; do
            sed -i "s/__RELEASE_SHA__/$sha/g" "$script"
            sh -n "$script"
            grep -q "$sha" "$script"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Release commit SHA: `%s`\n\n' "$(git rev-parse HEAD)" > release-notes.md
          cat RELEASE_NOTES.md >> release-notes.md
          cp companion/scan-hh.mjs.txt scan-hh.mjs
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in *-*) prerelease_flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" ru-market.json install.sh update.sh scan-hh.mjs companion/local-parser.patch companion/core-contract.patch $prerelease_flag --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
